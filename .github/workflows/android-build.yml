name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease -x processReleaseGoogleServices

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -type f -name '*.apk' -print -quit)"      

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Android Build #${{ github.run_number }}
          body: |
            Automated Android build from branch **${{ github.ref_name }}**.

            Commit: ${{ github.sha }}

            APK files are attached below. The workflow is manually triggered.
          files: release-files/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: false

      - name: Report build failure
        if: failure()
        run: echo "Android build or GitHub Release publishing failed. Check the logs above for details."
